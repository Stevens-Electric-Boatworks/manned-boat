%YAML 1.2
---
# To replay data, use the following command
# ros2 bag play --publish-service-requests {BAG_FILE} --remap /rosout:=/logout

launch:
  - node:
      pkg: "shore_comms"
      exec: "shore"
      name: "shore_comms"
      param:
        - name: "data_send"
          value: 0.1
        - name: "replay_mode"
          value: true

  - node:
      pkg: "alarms_manager_node"
      exec: "main"
      name: "alarms_watchdog"
      param:
        - name: "faults_file"
          value: "~/eboat_src/data/FAULTS.csv"
        - name: "replay_mode"
          value: true
